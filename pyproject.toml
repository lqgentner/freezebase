[project]
name = "freezebase"
description = "Lightweight geospatial helpers for reproducible MGRS grids and S3-backed raster workflows."
authors = [
  { name = "Luis Gentner" , email = "luis.gentner@geo.uzh.ch"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "geospatial",
    "mgrs",
    "utm",
    "raster",
    "geotiff",
    "cog",
    "vrt",
    "s3",
    "sentinel-1",
    "remote-sensing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dynamic = ["version"]
# Lower bounds reflect the oldest release that both supports the required
# Python (>=3.12) and works with this code. Notably `numpy>=2.0` is required
# because the code uses `np.concat` (added in NumPy 2.0).
dependencies = [
    "affine>=2.4.0",
    "geopandas>=1.1",
    "mgrs>=1.4.4",
    "numpy>=2.0",
    "odc-geo>=0.5.0",
    "pandas>=2.3",
    "platformdirs>=3.0",
    "pyarrow>=17.0",
    "pyproj>=3.6.1",
    "rasterio>=1.5.0",
    "requests>=2.28",
    "rich>=13",
    "shapely>=2.1.0",
    "tenacity>=8.2",
    "universal-pathlib>=0.3",
]

[project.optional-dependencies]
s3 = [
    # s3fs 2026.2.0 first exposes `set_custom_error_handler` (used in s3.py).
    "s3fs>=2026.2.0",
    "fsspec>=2026.2.0",
    "boto3>=1.36",
]

[project.urls]
Homepage = "https://github.com/lqgentner/freezebase"
Repository = "https://github.com/lqgentner/freezebase"
Issues = "https://github.com/lqgentner/freezebase/issues"
Changelog = "https://github.com/lqgentner/freezebase/blob/main/CHANGELOG.md"

[dependency-groups]
# Dev tools carry lower bounds too, so `uv sync --resolution lowest-direct`
# (used by the lowest-bound CI job) resolves a working toolchain instead of
# dragging e.g. pytest down to an ancient, uninstallable release.
dev = [
    "mypy>=2.3",
    "pandas-stubs>=2.3",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "types-geopandas>=1.1",
    "types-requests>=2.33",
]
# Documentation toolchain. `great-docs` renders the site via Quarto (which must
# be installed separately, see user_guide/). The plotting stack is only needed
# because the user guide executes its figures at build time.
docs = [
    "great-docs>=0.17",
    "matplotlib>=3.11",
    "contextily>=1.7",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/freezebase"]

# Ship a lean, reproducible sdist: the package sources, the test suite (so
# downstreams can run it), and the project/license/readme metadata -- but not
# local developer scaffolding (`.python-version`, `.gitignore`, `uv.lock`).
[tool.hatch.build.targets.sdist]
include = [
    "src/freezebase",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [".gitignore"]

[tool.ruff]
line-length = 99
src = ["src"]
extension = { qmd = "markdown" }

[tool.ruff.lint]
# Ruff 0.16's expanded defaults remain implicit here
extend-select = [
    "C90",  # McCabe complexity
    "N",    # PEP 8 naming
    "D",    # Numpy-style docstrings
    "ANN",  # Type annotation coverage
    "S",    # Security checks
    "FBT",  # Boolean traps
    "A",    # Builtin shadowing
    "EM",   # Exception-message style
    "ICN",  # Import conventions
    "INP",  # Package structure
    "PT",   # Pytest style
    "Q",    # Quote correctness beyond formatter output
    "RSE",  # Raise-statement correctness
    "RET",  # Return-statement correctness
    "SLF",  # Private-member access
    "SLOT", # Slot usage
    "TID",  # Import hygiene
    "TC",   # Type-checking imports
    "ARG",  # Unused arguments
    "PTH",  # pathlib usage
    "TD",   # TODO format
    "FIX",  # Unresolved FIXME/TODO markers
    "PD",   # pandas practices
    "PL",   # Additional Pylint checks
    "TRY",  # Exception-handling practices
    "NPY",  # NumPy practices
    "PERF", # Performance checks
]

ignore = [
    "ANN003",   # flake8-annotations - Missing type annotations for **kwargs
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed in `value`
    "PLR0913",  # Pylint - Too many arguments
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = false

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",     # Allow asserts in tests
    "S105",     # Allow dummy passwords in tests
    "S106",     # Allow dummy passwords passed as arguments in tests
    "D101",     # Test class names are self-documenting
    "D102",     # Test method names are self-documenting
    "D103",     # Test function names are self-documenting
    "FBT",      # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR2004",  # Allow magic values in tests
    "SLF001",   # Allow accesses on "private" class members.
    "TC003",    # Runtime imports of stdlib types are fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["freezebase"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: tests requiring a live S3-compatible service (MinIO); configured via FREEZEBASE_TEST_S3_* env vars, skipped when unset.",
]
filterwarnings = [
    # Raised inside rasterio's compiled _io.pyx read() path under NumPy 2.5;
    # only a future rasterio release (>1.5.0) can fix it at the source.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["freezebase"]

[tool.coverage.report]
# Regression guard, not a target. The floor is intentionally below current
# coverage because the S3 credential/env paths in `raster.py` need a live
# object store to exercise; raise this as S3 integration tests land.
fail_under = 78
show_missing = true
