# Prose rules for the Markdown and Quarto files. Run `vale sync` once to
# download the packages into .vale/styles, then
# `vale $(git ls-files '*.md' '*.qmd')`. Vale does not read .gitignore, but
# passing only tracked files keeps .venv/, the build output and caches out.
# `vale .` walks them and is slow.
#
# Each rule that is off conflicts with a convention of these docs, or reports
# mostly correct text. The reason is given beside it.

StylesPath = .vale/styles
# Suggestions are left out: Google.Semicolons, for example, reports every
# semicolon, whether it fits or not.
MinAlertLevel = warning

# Terms in .vale/styles/config/vocabularies/freezebase/accept.txt pass the
# spelling check, and Vale.Terms enforces their case.
Vocab = freezebase
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, https://github.com/errata-ai/proselint/releases/download/v0.3.3/proselint.zip, https://github.com/tbhb/vale-ai-tells/releases/download/v1.33.0/ai-tells.zip

[formats]
qmd = md

[*.{md,qmd}]
BasedOnStyles = Vale, Google, proselint, ai-tells
# Google.WordList reports "Cloud" in the product name "Cloud Optimized
# GeoTIFF" as a reference to Google Cloud.
TokenIgnores = (Cloud[-\s]Optimized)

# MGRS, UTM, COG, VRT and the other acronyms are used throughout.
Google.Acronyms = NO
# It asks for lowercase after a colon, which reports every acronym there.
Google.Colons = NO
# The docs use full verb forms.
Google.Contractions = NO
# The docs use a spaced em dash.
Google.EmDash = NO
# It counts acronyms and tool names, such as GDAL and uv, as capitals.
Google.Headings = NO
# "1st" and "2nd" are the usual notation in dates and lists; it asks for
# "first" and "second".
Google.Ordinal = NO
# It reports clauses that are not lists.
Google.OxfordComma = NO
# Parentheses contain units, defaults and references.
Google.Parens = NO
# A passive is often the precise form: "the path is opened".
Google.Passive = NO
# A quoted string keeps its punctuation outside the quotes.
Google.Quotes = NO

# It reports run-in bold labels and reference entries.
ai-tells.ColonUsage = NO
# It reports en-dash ranges, such as "Python 3.12–3.15". The docs use a
# spaced em dash.
ai-tells.EmDashUsage = NO
# Headings are link anchors, so renaming one breaks the links to it.
ai-tells.ExplainerHeadings = NO
# It reports "implementation" and "implement", which are exact words.
ai-tells.FormalRegister = NO
# It reports "for example", which Google.Latin asks for instead of "e.g.".
ai-tells.FormalTransitions = NO
# It reports author names in reference lists.
ai-tells.MicDrop = NO
# Its fix is a contraction, and the docs use full verb forms.
ai-tells.NegatedObject = NO
# Google.Semicolons owns the semicolon.
ai-tells.SemicolonUsage = NO
# It reports plain lists of facts.
ai-tells.VerbTricolon = NO

# Released entries are a record and are not reworded.
[CHANGELOG.md]
BasedOnStyles =
