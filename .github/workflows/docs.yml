name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags/history, and Great Docs
          # reads commit dates for its page timestamps.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Own cache entry: the shared one is saved by whichever CI job finishes
          # first, without the docs group or the wheels Python 3.15 builds from source.
          cache-suffix: docs

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # `--all-extras` is required, not optional: the "Rasters on S3" guide
      # imports `freezebase.s3`, which lives behind the `s3` extra. The `docs`
      # group carries great-docs itself plus the plotting stack the guides
      # execute with.
      - name: Install dependencies
        run: uv sync --all-extras --group docs

      # The user guide executes against the public Copernicus DEM bucket and
      # fetches basemap tiles, so this step needs network egress.
      - name: Build site
        run: uv run great-docs build

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

  publish-docs:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
