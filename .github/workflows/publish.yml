name: Publish

# Builds and validates the distribution once, then publishes those exact files
# via PyPI Trusted Publishing (OIDC), so no API tokens are stored in the repo.
# Configure the trusted publisher and GitHub environments once before first use:
#
#   1. On PyPI (and TestPyPI): add a trusted publisher for this repo pointing at
#      this workflow file (`publish.yml`) and the matching environment name.
#   2. On GitHub: create environments named `pypi` and `testpypi`.
#
# Usage:
#   - Publish a GitHub Release -> publishes vX.Y.Z or vX.Y.ZrcN to PyPI. Mark
#     an rc release as a GitHub prerelease; development versions are rejected.
#   - Run manually -> publishes X.Y.Z.dev<run number> to TestPyPI, where X.Y.Z
#     is the requested target release.
#
# Nothing is uploaded until the same commit has passed the full CI gate: `gate`
# runs the identical lint, typing, test-matrix, lower-bound, S3 integration and
# build jobs used on every push. It also supplies the immutable artifact to the
# publishing job, so a red commit or untested rebuild can never be released.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_version:
        description: Target release for the TestPyPI dev build (X.Y.Z).
        required: true
        type: string

jobs:
  # Reuses ci.yml wholesale rather than duplicating its steps, so the release
  # gate can never drift from the checks run on `main`.
  gate:
    uses: ./.github/workflows/ci.yml
    with:
      build_version: ${{ github.event_name == 'workflow_dispatch' && format('{0}.dev{1}', inputs.target_version, github.run_number) || '' }}
    permissions:
      contents: read
      id-token: write

  publish-testpypi:
    # Manual rehearsal: publish the gate's unique .devN artifact to TestPyPI.
    needs: gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    # Stable and rc releases publish the exact artifact accepted by the gate.
    needs: gate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]; then
            echo "PyPI releases require a vX.Y.Z or vX.Y.ZrcN tag; got $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
